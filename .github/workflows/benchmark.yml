name: Multi-Crop BO Benchmark

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crop: [Lettuce, Strawberry, Spinach, Asparagus, Cabbage]
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          
      - name: Install Dependencies
        run: |
          Rscript -e 'install.packages(c("dplyr"), repos="https://cloud.r-project.org")'
          
      - name: Run Benchmark Script for ${{ matrix.crop }}
        run: |
          Rscript benchmark.R ${{ matrix.crop }}
          
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: bo-results-${{ matrix.crop }}
          path: results/
          retention-days: 7
